name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: Boundary check (only ecad-view may depend on CADCraft)
        if: runner.os == 'Linux'
        run: |
          # The core must not reach CADCraft at all, even indirectly.
          for crate in ecad-model ecad-rules ecad-reports ecad-project ecad-exchange; do
            if cargo tree -p "$crate" --edges normal --prefix none | grep -q '^cadcraft'; then
              echo "::error::$crate depends on CADCraft"; exit 1
            fi
          done
          # Every other crate except ecad-view must not depend on it directly.
          for crate in ecad-editor ecad-cli ecad-mcp ecad-app; do
            if cargo tree -p "$crate" --edges normal --prefix none --depth 1 | grep -q '^cadcraft'; then
              echo "::error::$crate depends on CADCraft directly"; exit 1
            fi
          done
      - name: Demo output and project round trip
        if: runner.os == 'Linux'
        run: |
          cargo run -p ecad-cli --locked -- demo out
          cargo run -p ecad-cli --locked -- new-sample out/sample-project
          cargo run -p ecad-cli --locked -- check out/sample-project
          cargo run -p ecad-cli --locked -- new-sample out/conveyor conveyor
          cargo run -p ecad-cli --locked -- check out/conveyor --strict
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: demo-output
          path: out/

  bench:
    name: benchmarks (counts, smoke, instructions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: cargo build --release --locked -p ecad-bench
      # Deterministic counts must match the baseline (fails); times are printed only.
      - name: Smoke suite and counts
        run: |
          target/release/ecad-bench suite --size smoke --out bench-smoke.json
          target/release/ecad-bench compare bench-smoke.json bench/baseline-smoke.json
      # Instruction counts against the baseline: a warning, never a failure.
      - name: Instruction counts
        run: target/release/ecad-bench instructions bench/instructions-conveyor.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-smoke
          path: bench-smoke.json

  mcp-client:
    name: MCP server with the official client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cargo build -p ecad-mcp -p ecad-cli --locked
      # The MCP Python SDK as a real client: initialize, list tools, read, edit, save.
      - run: pip install "mcp>=1.10,<3"
      - run: python crates/ecad-mcp/tests/client/check.py target/debug/ecad-mcp target/debug/ecad "$RUNNER_TEMP"
