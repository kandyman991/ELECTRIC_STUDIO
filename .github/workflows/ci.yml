name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: Boundary check (only ecad-view may depend on CADCraft)
        if: runner.os == 'Linux'
        run: |
          # The core must not reach CADCraft at all, even indirectly.
          for crate in ecad-model ecad-reports ecad-project; do
            if cargo tree -p "$crate" --edges normal --prefix none | grep -q '^cadcraft'; then
              echo "::error::$crate depends on CADCraft"; exit 1
            fi
          done
          # Every other crate except ecad-view must not depend on it directly.
          for crate in ecad-editor ecad-cli; do
            if cargo tree -p "$crate" --edges normal --prefix none --depth 1 | grep -q '^cadcraft'; then
              echo "::error::$crate depends on CADCraft directly"; exit 1
            fi
          done
      - name: Demo output and project round trip
        if: runner.os == 'Linux'
        run: |
          cargo run -p ecad-cli --locked -- demo out
          cargo run -p ecad-cli --locked -- new-sample out/sample-project
          cargo run -p ecad-cli --locked -- check out/sample-project
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: demo-output
          path: out/
