<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Electric Studio (Tauri)</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <header id="toolbar">
    <button data-tool="select" title="Click to select, drag to move (Esc)">Select</button>
    <button data-tool="wire" title="Click two connection points (W)">Wire</button>
    <span class="sep"></span>
    <span id="palette"></span>
    <span class="sep"></span>
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <button id="fit" title="Zoom to the whole page (F)">Fit</button>
    <button id="save" title="Ctrl+S">Save</button>
  </header>
  <main>
    <canvas id="canvas"></canvas>
    <aside id="inspector">
      <h2>Selection</h2>
      <div id="selected" hidden>
        <label for="tag">Device tag</label>
        <input id="tag" spellcheck="false">
        <button id="rename">Rename</button>
        <p class="hint">R rotates, Delete removes.</p>
      </div>
      <p id="nothing">Nothing selected.</p>
      <hr>
      <p class="hint">Middle-drag to pan, wheel to zoom.</p>
    </aside>
  </main>
  <footer id="status">Connecting to the editor…</footer>
</body>
</html>
