[package]
name = "ecad-tauri"
description = "Test shell: Electric Studio's editor in a Tauri window (M1b comparison)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "electric-studio-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
ecad-editor = { workspace = true }
# devtools: right-click > Inspect in test builds, to diagnose problems on users' machines.
# Remove before a real release.
tauri = { workspace = true, features = ["devtools"] }
serde = { workspace = true }

[lints]
workspace = true
