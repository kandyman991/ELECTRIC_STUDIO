[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/kandyman991/ELECTRIC_STUDIO"
publish = false

[workspace.dependencies]
ecad-model = { path = "crates/ecad-model" }
ecad-view = { path = "crates/ecad-view" }
ecad-reports = { path = "crates/ecad-reports" }
ecad-project = { path = "crates/ecad-project" }
ecad-editor = { path = "crates/ecad-editor" }
serde_json = "1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
png = "0.18"

# CADCraft, used as a library and pinned to one upstream commit (see docs/CADCRAFT.md).
# Only ecad-view may depend on these crates.
cadcraft-doc = { git = "https://github.com/storytold/cadcraft", rev = "0d4b100209990e485891d85c70ff465c8e709156" }
cadcraft-render = { git = "https://github.com/storytold/cadcraft", rev = "0d4b100209990e485891d85c70ff465c8e709156" }
cadcraft-io = { git = "https://github.com/storytold/cadcraft", rev = "0d4b100209990e485891d85c70ff465c8e709156" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Copied from CADCraft's root Cargo.toml at the pinned commit: Cargo ignores patches declared
# inside dependencies, so they must be repeated here. Update together with the CADCraft rev.
[patch.crates-io]
krilla = { version = "=0.8.2", git = "https://github.com/storytold/craft-libs", rev = "453b0da782ccef39be9a6dac8d27c80b553ef1cc" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "453b0da782ccef39be9a6dac8d27c80b553ef1cc" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "453b0da782ccef39be9a6dac8d27c80b553ef1cc" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "453b0da782ccef39be9a6dac8d27c80b553ef1cc" }
hayro-cmap = { git = "https://github.com/storytold/craft-libs", rev = "453b0da782ccef39be9a6dac8d27c80b553ef1cc" }
hayro-postscript = { git = "https://github.com/storytold/craft-libs", rev = "453b0da782ccef39be9a6dac8d27c80b553ef1cc" }

[profile.dev.package."*"]
opt-level = 2
